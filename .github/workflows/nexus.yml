name: Build NEXUS HOME

on:
  push:
    branches: [ symbolize ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nexus:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@v4

    - name: Submodule und Werkzeuge
      run: |
        git config --global --add safe.directory '*'
        git submodule update --init --depth 1 libs/json libs/zip libs/Plutonium libs/libnx-ext libs/stb arc
        sudo -n apt-get update
        sudo -n apt-get install -y python3 python3-pip python-is-python3 zip g++
        python -m pip install requests --break-system-packages || python -m pip install requests
        sudo -n dkp-pacman --noconfirm -U "https://wii.leseratte10.de/devkitPro/other-stuff/dkp-toolchain-vars-1.0.2-1-any.pkg.tar.xz"
        chmod 777 -R "$GITHUB_WORKSPACE"

    - name: Kern-Tests (Schema, Bibliothek, Speichern, Anordnungen)
      run: |
        gcc -O1 -c libs/zip/src/zip.c -o /tmp/zip.o
        g++ -std=gnu++20 -O1 -Ilibs/json/single_include -Ilibs/zip/src -Iprojects/nexus/source/core nexus/tests/core_test.cpp projects/nexus/source/core/*.cpp /tmp/zip.o -o /tmp/core_test
        /tmp/core_test

    - name: libnx master (wie uLaunch)
      run: |
        git clone --depth 1 https://github.com/switchbrew/libnx /tmp/libnx
        make -C /tmp/libnx -j$(nproc)
        cp -r /tmp/libnx/nx/external/bsd/include /tmp/libnx/nx

    - name: Test-App (NRO) bauen
      run: |
        if ! make -C projects/nexus -j$(nproc); then
          make -C projects/nexus clean
          make -C projects/nexus -j$(nproc) LIBNX=/tmp/libnx/nx
        fi

    - name: NEXUS-uMenu bauen (ersetzt die uLaunch-Oberfläche)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # arc fragt die GitHub-API ab; ohne Anmeldung greift dort das Abfragelimit -> Token mitgeben
        sed -i 's|requests.get(gh_api_url)|requests.get(gh_api_url, headers=({"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]} if os.environ.get("GITHUB_TOKEN") else {}))|' arc/arc_db_gen.py
        # uLaunch 1.2.3 erwartet die libnx-Struktur der stabilen Version (NacpStruct::lang); libnx master nur als Rückfall
        if ! make -j$(nproc) umenu; then
          make -C projects/uMenu clean; make -C libs/uCommon clean || true
          make -j$(nproc) LIBNX=/tmp/libnx/nx/ umenu
        fi

    - name: Absturzadressen aufloesen
      run: |
        E=$(find projects/uMenu -name '*.elf' | head -1); echo "ELF: $E"
        for a in 0x8FEA14 0x8FEA08 0x8CE7B4 0x7A525C 0x7F31F4 0x7DA2A8; do echo "== $a"; $DEVKITPRO/devkitA64/bin/aarch64-none-elf-addr2line -f -C -i -e "$E" $a; done

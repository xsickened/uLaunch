name: Build NEXUS HOME

on:
  push:
    branches: [ nexus-home ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nexus:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@v4

    - name: Submodule und Werkzeuge
      run: |
        git config --global --add safe.directory '*'
        git submodule update --init --depth 1 libs/json libs/zip libs/Plutonium libs/libnx-ext libs/stb arc
        sudo -n apt-get update
        sudo -n apt-get install -y python3 python3-pip python-is-python3 zip g++
        python -m pip install requests --break-system-packages || python -m pip install requests
        sudo -n dkp-pacman --noconfirm -U "https://wii.leseratte10.de/devkitPro/other-stuff/dkp-toolchain-vars-1.0.2-1-any.pkg.tar.xz"
        chmod 777 -R "$GITHUB_WORKSPACE"

    - name: Kern-Tests (Schema, Bibliothek, Speichern, Anordnungen)
      run: |
        g++ -std=gnu++20 -O1 -Ilibs/json/single_include -Iprojects/nexus/source/core nexus/tests/core_test.cpp projects/nexus/source/core/*.cpp -o /tmp/core_test
        /tmp/core_test

    - name: libnx master (wie uLaunch)
      run: |
        git clone --depth 1 https://github.com/switchbrew/libnx /tmp/libnx
        make -C /tmp/libnx -j$(nproc)
        cp -r /tmp/libnx/nx/external/bsd/include /tmp/libnx/nx

    - name: Test-App (NRO) bauen
      run: |
        if ! make -C projects/nexus -j$(nproc); then
          make -C projects/nexus clean
          make -C projects/nexus -j$(nproc) LIBNX=/tmp/libnx/nx
        fi

    - name: NEXUS-uMenu bauen (ersetzt die uLaunch-Oberfläche)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # arc fragt die GitHub-API ab; ohne Anmeldung greift dort das Abfragelimit -> Token mitgeben
        sed -i 's|requests.get(gh_api_url)|requests.get(gh_api_url, headers=({"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]} if os.environ.get("GITHUB_TOKEN") else {}))|' arc/arc_db_gen.py
        make -j$(nproc) LIBNX=/tmp/libnx/nx/ umenu

    - name: SD-Paket zusammenstellen
      run: |
        mkdir -p out/switch/nexus out/nexus/art out/ulaunch/bin/uMenu
        cp projects/nexus/nexus.nro out/switch/nexus/nexus.nro
        cp SdOut/ulaunch/bin/uMenu/main SdOut/ulaunch/bin/uMenu/main.npdm SdOut/ulaunch/bin/uMenu/romfs.bin out/ulaunch/bin/uMenu/
        cat > out/nexus/art/LIESMICH.txt << 'EOF'
        Eigene Bilder pro Titel (Titel-ID siehe Kontextmenü X in NEXUS):
          sdmc:/nexus/art/<TITEL-ID>/grid.jpg   Cover (nur Kachel)
          sdmc:/nexus/art/<TITEL-ID>/hero.jpg   Hintergrund (Ebene 1)
          sdmc:/nexus/art/<TITEL-ID>/logo.png   schwebendes Logo (Ebene 3, transparent)
        Danach in NEXUS: X > Eigene Bilder > Bilder neu einlesen.
        EOF
        cat > out/NEXUS-LIESMICH.txt << 'EOF'
        NEXUS HOME - Installation (setzt installiertes uLaunch 1.2.3 voraus)
        1. Sicherung: Ordner sdmc:/ulaunch/bin/uMenu am PC kopieren (z. B. nach uMenu-original).
        2. Ordner "ulaunch", "nexus" und "switch" aus diesem Paket in die oberste Ebene der SD-Karte kopieren.
        3. Switch neu starten.
        Notausgang:
          - L gedrückt halten, während das Menü erscheint -> klassisches uLaunch (nur diese Sitzung)
          - Im NEXUS-Menü (+) -> "Klassisches uLaunch-Menü"; zurück mit ZL halten + ZR
          - Nach zwei Fehlstarts schaltet NEXUS automatisch auf klassisch um
          - Komplett zurück: gesicherten uMenu-Ordner zurückkopieren oder uLaunch-v1.2.3.zip erneut aufspielen
        EOF

    - name: ZIP für die SD-Karte
      run: cd out && zip -r ../NEXUS-HOME-SD.zip .

    - name: Release „nexus-latest“ aktualisieren
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nexus-latest
        name: NEXUS HOME – aktueller Build
        prerelease: true
        files: NEXUS-HOME-SD.zip
        body: |
          NEXUS HOME (Commit ${{ github.sha }}) – ersetzt die Oberfläche von uLaunch 1.2.3 (Atmosphère 1.10.2 / FW 21.2.0).
          Installation und Notausgang: siehe NEXUS-LIESMICH.txt im ZIP.
          Enthält zusätzlich die Test-App switch/nexus/nexus.nro.

    - uses: actions/upload-artifact@v4
      with:
        name: NEXUS-HOME-SD
        path: out/
        if-no-files-found: error
